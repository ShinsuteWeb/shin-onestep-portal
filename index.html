<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シンOneStepポータル</title>
<meta name="description" content="シンOneStepのメンバー向けポータル。メンバー紹介・お題アーカイブ・アニメ投票への入口です。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="シンOneStepポータル">
<meta property="og:title" content="シンOneStepポータル">
<meta property="og:description" content="メンバー紹介・お題アーカイブ・アニメ投票への入口です。">
<meta property="og:url" content="https://shinsuteweb.github.io/shin-onestep-portal/">
<meta property="og:image" content="https://shinsuteweb.github.io/shin-onestep-portal/ogp-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4e8067">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OneStepポータル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{--bg:#f5f4ef;--card:#fff;--ink:#24362b;--muted:#68756e;--line:#e7e4dc;--green:#4e8067;--green-dark:#3c6752}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 18px 48px}
  header{text-align:center;margin-bottom:26px}
  header .mark{font-size:30px}
  header h1{font-size:26px;margin:8px 0 6px;letter-spacing:.02em}
  header p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
  main{width:min(100%,440px)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:0 16px 44px rgba(36,54,43,.08)}
  .panel h2{margin:0 0 6px;font-size:18px}
  .panel .desc{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.7}
  label{display:block;margin-bottom:8px;font-size:14px;font-weight:700}
  input[type=password]{width:100%;height:48px;padding:0 14px;border:1px solid #d9ded8;border-radius:12px;font:inherit}
  button.primary{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button.primary:hover{background:var(--green-dark)}
  button.primary:disabled{opacity:.55;cursor:wait}
  .error{min-height:22px;margin-top:10px;color:#b33;font-size:13px}
  .menu{display:grid;gap:12px}
  a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--ink);text-decoration:none;box-shadow:0 8px 24px rgba(36,54,43,.05)}
  a.card:hover{border-color:#b9cfc0;transform:translateY(-1px)}
  a.card .icon{font-size:26px}
  a.card .t{font-size:16px;font-weight:700}
  a.card .s{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  a.card .arrow{margin-left:auto;color:var(--muted);font-size:20px}
  .status{margin-top:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
  .logout{margin-top:10px;background:none;border:1px solid #d9ded8;color:var(--muted);border-radius:10px;padding:8px 16px;font:inherit;font-size:12px;cursor:pointer}
  .logout:hover{color:#b33;border-color:#b33}
  .bday-h{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0 0 6px}
  .bday-row{display:flex;gap:14px;align-items:center;padding:7px 0}
  .bday-cal{flex:none;width:60px;background:#fff;border:1.5px solid #ddd6c8;border-radius:10px;overflow:hidden;text-align:center}
  .bday-cal .m{background:#c94f4f;color:#fff;font-size:11px;font-weight:700;padding:3px 0}
  .bday-cal .d{font-size:25px;font-weight:800;line-height:1.2}
  .bday-cal .w{font-size:10px;color:var(--muted);padding-bottom:4px}
  .bday-name{font-size:17px;font-weight:700}
  .bday-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .bday-sub.today{color:#c0392b;font-weight:700}
  [hidden]{display:none!important}
  footer{margin-top:auto;padding-top:28px;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<header>
  <div class="mark">✦</div>
  <h1>シンOneStepポータル</h1>
</header>
<main>
  <!-- ログイン -->
  <section class="panel" id="loginPanel">
    <h2>パスワードを入力してください</h2>
    <p class="desc">最初に1回だけ入力すれば、この端末・ブラウザでは30日間、各サイトで入れ直さなくてよくなります。</p>
    <form id="loginForm">
      <label for="pw">共通パスワード</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <button class="primary" id="loginBtn" type="submit">ポータルを開く</button>
      <div class="error" id="loginError" role="alert"></div>
    </form>
  </section>

  <!-- お誕生日（解錠後に読み込む） -->
  <section id="birthdayPanel" hidden style="margin-bottom:20px;padding:0 4px">
    <h2 class="bday-h">🎂 お誕生日</h2>
    <div id="birthdayBody"></div>
  </section>

  <!-- メニュー -->
  <section id="menuPanel" hidden>
    <div class="menu">
      <a class="card" href="https://shinsuteweb.github.io/shin-onestep-profile2/">
        <span class="icon">👥</span>
        <span><span class="t">メンバー紹介</span><span class="s">自己紹介サイト</span></span>
        <span class="arrow">›</span>
      </a>
      <a class="card" href="https://shinsuteweb.github.io/Shinsute-odai-archive/">
        <span class="icon">📚</span>
        <span><span class="t">お題アーカイブ</span><span class="s">毎週のお題と回答の記録</span></span>
        <span class="arrow">›</span>
      </a>
      <a class="card" href="https://shinsuteweb.github.io/shin-onestep-AnimeVote3/">
        <span class="icon">🗳️</span>
        <span><span class="t">アニメ投票</span><span class="s">今期の視聴アニメ投票</span></span>
        <span class="arrow">›</span>
      </a>
    </div>
    <div class="status">
      <div id="remainText"></div>
      <button class="logout" id="logoutBtn" type="button">ログアウト（この端末の保存を消す）</button>
    </div>
  </section>
</main>
<footer>ShinOneStep Portal</footer>

<script>
(function(){
  "use strict";
  var KEY = "onestep.portal.v1";
  var HASH = "14e18b67771a66cb08559baef772ba9537688e3f5996e44beefbb8d9ae11772b";
  var DAYS = 30;
  var SUPABASE_URL = "https://dtihrpjoengpakwipehl.supabase.co";
  var SUPABASE_KEY = "sb_publishable__d5BEd58nkRFmlfbneFvfw_nyBCzvIX";
  var FALLBACK_URL = "https://shinsuteweb.github.io/shin-onestep-profile2/profiles.enc.json";
  var ITERATIONS = 600000;
  var AAD = new TextEncoder().encode("shin-onestep-profile-v1");
  var enc = function(s){ return new TextEncoder().encode(s); };
  var fromHex = function(h){ var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; };

  var loginPanel = document.getElementById("loginPanel");
  var menuPanel = document.getElementById("menuPanel");
  var remainText = document.getElementById("remainText");

  function readStore(){
    try {
      var j = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!j || !j.pw || !j.exp) return null;
      if (Date.now() > j.exp) { localStorage.removeItem(KEY); return null; }
      return j;
    } catch (e) { return null; }
  }
  function writeStore(pw){
    try { localStorage.setItem(KEY, JSON.stringify({ pw: pw, exp: Date.now() + DAYS * 24 * 60 * 60 * 1000 })); } catch (e) {}
  }
  function showMenu(j){
    loginPanel.hidden = true;
    menuPanel.hidden = false;
    var left = Math.max(0, Math.ceil((j.exp - Date.now()) / (24 * 60 * 60 * 1000)));
    remainText.textContent = "ログイン中（この端末ではあと約" + left + "日間、パスワード入力なしで開けます）";
  }
  function showLogin(){
    menuPanel.hidden = true;
    document.getElementById("birthdayPanel").hidden = true;
    loginPanel.hidden = false;
  }
  async function sha256hex(s){
    var d = await crypto.subtle.digest("SHA-256", enc(s));
    return Array.from(new Uint8Array(d)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  }
  async function fetchBundle(){
    try {
      var r = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_profile_bundle", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
        body: "{}"
      });
      if (r.ok) { var j = await r.json(); if (j && j.ciphertext) return j; }
    } catch (e) {}
    var r2 = await fetch(FALLBACK_URL, { cache: "no-store" });
    if (!r2.ok) throw new Error("bundle fetch failed");
    return r2.json();
  }
  async function decryptPages(pw){
    var box = await fetchBundle();
    var material = await crypto.subtle.importKey("raw", enc(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: fromHex(box.salt), iterations: ITERATIONS, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromHex(box.nonce), additionalData: AAD }, key, fromHex(box.ciphertext));
    var inflated = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(inflated));
  }

  function parseBirthdays(contents){
    var out = [];
    var tables = String(contents || "").match(/<table>[\s\S]*?<\/table>/g) || [];
    tables.forEach(function(t){
      var nm = t.match(/<strong>名前：<\/strong>([^<]+)/);
      var bd = t.match(/<strong>誕生日：<\/strong>([^<]+)/);
      if (!nm || !bd) return;
      var raw = bd[1].trim();
      var dm = raw.match(/(\d{1,2})\s*\/\s*(\d{1,2})/) || raw.match(/(\d{1,2})月\s*(\d{1,2})日/);
      if (!dm) return;
      out.push({ name: nm[1].trim(), month: +dm[1], day: +dm[2] });
    });
    return out;
  }

  function renderBirthdays(pages){
    try {
      var list = parseBirthdays(pages && pages.contents);
      if (!list.length) return;
      var now = new Date();
      var hits = [];
      list.forEach(function(p){
        for (var add = 0; add <= 7; add++) {
          var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + add);
          if (d.getMonth() + 1 === p.month && d.getDate() === p.day) { hits.push({ name: p.name, add: add, month: p.month, day: p.day, wd: d.getDay() }); break; }
        }
      });
      if (!hits.length) return;
      hits.sort(function(a, b){ return a.add - b.add; });
      var wdNames = ["日", "月", "火", "水", "木", "金", "土"];
      var html = hits.map(function(h){
        var sub = h.add === 0
          ? '<div class="bday-sub today">今日が誕生日です！🎉</div>'
          : '<div class="bday-sub">あと' + h.add + '日・' + h.month + '月' + h.day + '日（' + wdNames[h.wd] + '）</div>';
        return '<div class="bday-row"><div class="bday-cal"><div class="m">' + h.month + '月</div><div class="d">' + h.day + '</div><div class="w">' + wdNames[h.wd] + '曜日</div></div>'
          + '<div><div class="bday-name">' + escapeHtml(h.name) + ' さん</div>' + sub + '</div></div>';
      }).join("");
      document.getElementById("birthdayBody").innerHTML = html;
      document.getElementById("birthdayPanel").hidden = false;
    } catch (e) {}
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }

  function loadBirthdays(pw){
    decryptPages(pw).then(renderBirthdays).catch(function(e){
      if (e && e.name === "OperationError") { try { localStorage.removeItem(KEY); } catch (x) {} showLogin(); }
    });
  }

  var saved = readStore();
  if (saved) { showMenu(saved); loadBirthdays(saved.pw); }

  document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var btn = document.getElementById("loginBtn");
    var err = document.getElementById("loginError");
    var pw = document.getElementById("pw").value;
    err.textContent = "";
    btn.disabled = true; btn.textContent = "確認中…";
    try {
      if (await sha256hex(pw) !== HASH) throw new Error("bad password");
      var pages = null;
      try { pages = await decryptPages(pw); }
      catch (de) {
        // 通信できない等で復号確認ができなかった場合は、ハッシュ一致をもって許可する
        if (de && de.name === "OperationError") throw new Error("bad password");
      }
      writeStore(pw);
      showMenu(readStore());
      if (pages) renderBirthdays(pages); else loadBirthdays(pw);
    } catch (ex) {
      err.textContent = "パスワードが違います。もう一度入力してください。";
      document.getElementById("pw").select();
    } finally {
      btn.disabled = false; btn.textContent = "ポータルを開く";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", function(){
    try { localStorage.removeItem(KEY); } catch (e) {}
    showLogin();
  });
})();
</script>
</body>
</html>
