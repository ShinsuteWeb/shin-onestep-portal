<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉オフ会関係 | 🐶シンOneStepポータル</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4e8067">
<style>
  :root{--bg:#f5f4ef;--card:#fff;--ink:#24362b;--muted:#68756e;--line:#e7e4dc}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 18px 48px}
  body::before{content:"";position:fixed;inset:0;background:url("bg.jpg") center center/cover no-repeat;z-index:-1}
  header{text-align:center;margin-bottom:4px}
  header h1{font-size:22px;margin:3px 0 2px;letter-spacing:.02em;text-shadow:0 1px 10px rgba(255,255,255,.85),0 0 3px rgba(255,255,255,.9)}
  .back{margin:2px 0 12px;font-size:13.5px}
  .back a{color:var(--ink);background:rgba(255,255,255,.82);border-radius:999px;padding:4px 14px;text-decoration:none}
  main{width:min(100%,440px)}
  .panel{background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(36,54,43,.05);padding:10px 12px;margin-bottom:16px}
  .panel h2{display:inline-block;background:rgba(56,148,214,.88);color:#fff;border-radius:999px;padding:4px 14px;font-size:15px;margin:0 0 4px}
  .ev{background:#fff;border-radius:10px;padding:10px 12px;margin-top:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .date{display:inline-block;background:#3894d6;color:#fff;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700}
  .date.first{background:#e8590c}
  .ev .ttl{font-weight:700;font-size:15px;margin:6px 0 4px}
  .ev .row{font-size:13px;color:#333;line-height:1.6;word-break:break-all}
  .ev .row a{color:#1c6fb8}
  .tbd{font-size:13.5px;line-height:1.9;color:#222;margin-top:8px}
  .rec{font-size:13.5px;line-height:2;color:#222}
  .rec a{color:#1c6fb8;font-weight:700}
  .upd{font-size:11.5px;color:var(--muted);text-align:right;margin-top:6px}
  .notice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;font-size:14px;line-height:1.8;text-align:center}
  .notice a{color:#1c6fb8;font-weight:700}
</style>
</head>
<body>
<header><h1>🎉 オフ会関係</h1></header>
<div class="back"><a href="./">← ポータルに戻る</a></div>
<main>
  <div id="locked" class="notice" hidden>このページはポータルで解錠すると見られます。<br><a href="./">ポータルを開く</a></div>
  <div id="content" hidden>
    <section class="panel">
      <h2>📅 オフ会の予定</h2>
      <div id="events"></div>
      <div class="tbd" id="tbd"></div>
      <div class="upd" id="upd"></div>
    </section>
    <section class="panel">
      <h2>🎉 オフ会の記録</h2>
      <div class="rec" id="records"></div>
    </section>
  </div>
</main>
<script>
(function(){
  var KEY = "onestep.portal.v1";
  function session(){
    try {
      var j = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!j || !j.pw || !j.exp) return null;
      if (Date.now() > j.exp) { localStorage.removeItem(KEY); return null; }
      return j;
    } catch (e) { return null; }
  }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function domain(u){ try { return new URL(u).hostname; } catch (e) { return u; } }
  if (!session()) { document.getElementById("locked").hidden = false; return; }
  fetch("offkai.json", { cache: "no-cache" }).then(function(r){ return r.json(); }).then(function(d){
    var today = new Date(); today.setHours(0,0,0,0);
    var evs = (d.events || []).filter(function(e){ var end = new Date(e.end + "T23:59:59"); return end >= today; });
    var html = "";
    evs.forEach(function(e, i){
      html += '<div class="ev"><span class="date' + (i === 0 ? " first" : "") + '">' + esc(e.dateLabel) + '</span>';
      html += '<div class="ttl">' + (e.mark ? esc(e.mark) + " " : "") + esc(e.title) + '</div>';
      if (e.place) html += '<div class="row">📍 ' + esc(e.place) + '</div>';
      if (e.members) html += '<div class="row">👥 ' + esc(e.members) + '</div>';
      if (e.url) html += '<div class="row">🔗 <a href="' + esc(e.url) + '">' + esc(domain(e.url)) + '</a></div>';
      if (e.content) html += '<div class="row">📝 ' + esc(e.content) + '</div>';
      if (e.note) html += '<div class="row">📌 ' + esc(e.note) + '</div>';
      html += '</div>';
    });
    if (!evs.length) html = '<div class="tbd">現在、予定はありません。</div>';
    document.getElementById("events").innerHTML = html;
    var tbd = d.tbd || [];
    if (tbd.length) {
      var t = "🗓️ <b>日程未定のオフ会</b><br>" + tbd.map(function(x){ return esc(x.mark || "🔹") + " " + esc(x.title) + "（主催：" + esc(x.host) + "）"; }).join("<br>");
      document.getElementById("tbd").innerHTML = t;
    }
    if (d.updated) {
      var p = d.updated.split("-");
      document.getElementById("upd").textContent = "（" + Number(p[0]) + "年" + Number(p[1]) + "月" + Number(p[2]) + "日更新）";
    }
    var rec = d.records || {};
    var r = "これまでに <b>" + esc(rec.count) + "回</b> 開催しました<br>";
    (rec.recent || []).forEach(function(x){ r += "・" + esc(x.date) + " " + esc(x.title) + "<br>"; });
    r += '　… <a href="' + esc(rec.url) + '">記録のページで全部見る →</a>';
    document.getElementById("records").innerHTML = r;
    document.getElementById("content").hidden = false;
  }).catch(function(){
    document.getElementById("locked").hidden = false;
  });
})();
</script>
</body>
</html>
